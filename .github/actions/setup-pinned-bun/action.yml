# The pinned Bun, in the one place every job installs it from: the pinned server's runtime and the
# clone detector's both read the pin's own packageManager row, so they cannot drift apart.
#
# Requires an already-checked-out repository with the external/opencode submodule initialized.
name: "Setup pinned Bun"
description: "Installs the Bun that the pinned server's packageManager row names, and verifies it."

runs:
  using: "composite"
  steps:
    - name: Setup Bun (pinned server runtime)
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # The pin's own packageManager row (external/opencode/package.json).
        bun-version-file: external/opencode/package.json

    - name: Verify pinned Bun runtime
      shell: pwsh
      run: |
        $expected = (Get-Content external/opencode/package.json -Raw | ConvertFrom-Json).packageManager
        $actual = "bun@$(& bun --version)"
        if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) {
          throw "Bun runtime mismatch: expected $expected, got $actual."
        }

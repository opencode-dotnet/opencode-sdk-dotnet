# The runtime the pinned server needs, in the one place both lanes read it from: CI (which runs
# the server from the submodule source) and the distributed-build consumer leg (whose simulation
# fixtures still run that source, even though its live legs drive the published build). One shared
# action keeps the two lanes from drifting apart; the Bun itself comes from setup-pinned-bun, which
# the clone gate uses too.
#
# Requires an already-checked-out repository with the external/opencode submodule initialized.
name: "Setup pinned server runtime"
description: "Installs the pinned Bun, provisions the exact ripgrep the server resolves, and installs the pinned server's dependencies."

runs:
  using: "composite"
  steps:
    - name: Setup pinned Bun
      uses: ./.github/actions/setup-pinned-bun

    # fs.find uses upstream's ripgrep resolver. Keep the server offline by placing the exact
    # resolver version on the job PATH before tests instead of allowing its runtime download.
    - name: Provision ripgrep for pinned server
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true
        $version = "15.1.0"
        switch ("${{ runner.os }}-${{ runner.arch }}") {
          "Windows-X64" {
            $archive = "ripgrep-$version-x86_64-pc-windows-msvc.zip"
            $sha256 = "124510b94b6baa3380d051fdf4650eaa80a302c876d611e9dba0b2e18d87493a"
          }
          "Linux-X64" {
            $archive = "ripgrep-$version-x86_64-unknown-linux-musl.tar.gz"
            $sha256 = "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599"
          }
          "macOS-ARM64" {
            $archive = "ripgrep-$version-aarch64-apple-darwin.tar.gz"
            $sha256 = "378e973289176ca0c6054054ee7f631a065874a352bf43f0fa60ef079b6ba715"
          }
          default { throw "Unsupported ripgrep runner: ${{ runner.os }}-${{ runner.arch }}" }
        }

        $download = Join-Path $env:RUNNER_TEMP $archive
        Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$version/$archive" -OutFile $download
        $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $sha256) {
          throw "ripgrep archive digest mismatch: expected $sha256, received $actual"
        }

        $toolRoot = Join-Path $env:RUNNER_TEMP "ripgrep-$version-${{ runner.os }}-${{ runner.arch }}"
        $null = New-Item -ItemType Directory -Path $toolRoot
        if ($archive.EndsWith(".zip", [StringComparison]::Ordinal)) {
          Expand-Archive -LiteralPath $download -DestinationPath $toolRoot
        } else {
          tar -xzf $download -C $toolRoot
        }

        $executableName = if ($IsWindows) { "rg.exe" } else { "rg" }
        $executables = @(Get-ChildItem -LiteralPath $toolRoot -Recurse -File -Filter $executableName)
        if ($executables.Count -ne 1) {
          throw "Expected exactly one $executableName in $archive, found $($executables.Count)"
        }

        $executable = $executables[0].FullName
        Split-Path -Parent $executable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & $executable --version

    # The install cache lives on the workspace's volume. On Windows runners the home directory
    # is on C: and the workspace on D:, so a home-directory cache cannot be hardlinked into
    # node_modules: Bun copies every file, and restoring the archive to C: alone took about three
    # minutes (2026-09-24, run 36013113686).
    - name: Place bun install cache beside the workspace
      shell: pwsh
      run: |
        "BUN_INSTALL_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'bun-install-cache')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Restore bun install cache
      id: bun-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/bun-install-cache
        key: ${{ runner.os }}-bun-${{ hashFiles('external/opencode/bun.lock') }}

    # --ignore-scripts skips the root postinstall, which repairs the separate Node PTY
    # implementation. Normal PTYs in this lane use Bun's bun-pty implementation.
    - name: Install pinned server dependencies
      shell: pwsh
      working-directory: external/opencode
      run: bun install --frozen-lockfile --ignore-scripts

    # Only master runs write the cache. A pull request's entry is readable by that pull request
    # alone, and those duplicates pushed the repository past its 10 GB cache quota, evicting the
    # entries every run reads.
    - name: Save bun install cache
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/bun-install-cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}

# Manual, human-triggered release lane. Nightlies publish automatically from ci.yml's
# publish-nightly job on every master push that changes more than Markdown or LICENSE; this workflow is the ONLY path to a stable version
# number, and it is never triggered by a push, tag, or GitHub Release event.
#
# The lane refuses any ref but master: "Run workflow" offers every branch in its selector, so a
# wrong pick would otherwise ship a feature or review branch as an exact stable version that
# NuGet.org can only unlist, never delete.
#
# The lane packs the commit that the commit input names, not the master tip at dispatch time, so the
# released commit is the one the operator reviewed even when master moves before the dispatch. The
# lane refuses a commit that master does not contain, and it reads the commit back from every
# package before any push.
#
# target: github pushes to GitHub Packages with GITHUB_TOKEN and works today.
#
# target: nuget publishes to NuGet.org via Trusted Publishing (OIDC through NuGet/login@v1, no
# API key — mirrors localstack-dotnet-client's publish-nuget.yml, PR #54). This requires a Trusted
# Publishing policy configured on the NuGet.org account that owns the packages (package IDs
# OpenCodeDotNet.Sdk and OpenCodeDotNet.Sdk.Extensions, repository opencode-dotnet/opencode-sdk-dotnet,
# workflow file publish-nuget.yml, no environment). NuGet.org keys the policy to the GitHub owner and
# repository ids it saw on first use, so moving the repository to another owner needs a new policy,
# not an edited one; until the policy matches, only target: github succeeds. The NuGet.org profile (or
# organization) name the policy is created under must also be set as the repository variable
# NUGET_TRUSTED_PUBLISHING_USER (Settings > Secrets and variables > Actions > Variables tab): the
# client's own workflow hardcodes its org name (`user: localstack-dotnet`), which is specific to
# that NuGet.org account and does not carry over here, so it is parameterized instead of guessed.
name: "Publish to NuGet"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to stamp on the packages (e.g. 0.8.0-preview.1 or 0.8.0)"
        required: true
      commit:
        description: "Full 40-character master commit SHA to pack"
        required: true
      target:
        type: choice
        description: Publish target
        required: true
        default: "github"
        options:
        - nuget
        - github

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  publish-manual:
    name: "Publish (${{ inputs.target }})"
    # workflow_dispatch is the lane's only trigger, so the ref is whatever the operator picked in
    # "Run workflow" - no event_name clause is needed here, only the branch guard itself.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Job-level union: id-token: write is needed only for the nuget path, packages: write only for
    # the github path. GitHub Actions grants permissions per job, not per step, so both are
    # declared here; whichever path a given dispatch does not take leaves its permission unused.
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      # No submodules: GenerationRequest.RepositoryDefault (tools/OpenCode.Sdk.Tools/Generator/
      # GenerationRequest.cs) points generate --verify at spec/openapi.json, tools/curation.json,
      # and tools/generation-profile.txt — all committed. Packing builds only src/OpenCode.Sdk and
      # src/OpenCode.Sdk.Extensions, which never reference external/opencode.
      # Full history, because the next step proves that master contains the commit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      # HEAD equals the input only when the input is a full commit SHA: a branch name, a tag, or a
      # short SHA resolves to a commit whose SHA differs from the input text, and the lane stops.
      - name: Verify commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$COMMIT" ]; then
            echo "::error::The commit input must be a full commit SHA. The checkout resolved it to $head."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$COMMIT" origin/master; then
            echo "::error::master does not contain $COMMIT."
            exit 1
          fi
          echo "Packing commit \`$COMMIT\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # The pinned .NET 11 release-candidate SDK carries only the .NET 11 runtime; the 10.0
          # SDK beside it runs the tools, which stay on the LTS release.
          global-json-file: global.json
          dotnet-version: 10.0.x

      # Two-layer defense against a partial generated surface (Directory.Build.targets' header
      # comment): that target refuses to pack on a missing or stale .generation-incomplete marker,
      # and this step additionally reruns the generator in --verify mode first, so a hand-edited or
      # stale marker is caught by regeneration rather than only by the marker's own text.
      - name: Verify generated output
        run: dotnet run --file tools/opencode-tool.cs -- generate --verify

      # -p:Version overrides VersionPrefix (Directory.Build.props) entirely rather than combining
      # with a suffix, so the operator's input becomes the exact stamped package version.
      - name: Pack
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: dotnet pack --configuration Release -p:Version="$PACKAGE_VERSION" --output packages

      # Nothing under another id may leave this lane: the two package ids, and the Extensions
      # package's dependency on the core package, are read back from the nuspecs before any push.
      - name: Verify package ids
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          core="packages/OpenCodeDotNet.Sdk.${PACKAGE_VERSION}.nupkg"
          extensions="packages/OpenCodeDotNet.Sdk.Extensions.${PACKAGE_VERSION}.nupkg"
          test "$(ls packages/*.nupkg | wc -l)" -eq 2
          unzip -p "$core" '*.nuspec' | grep -q "<id>OpenCodeDotNet.Sdk</id>"
          unzip -p "$extensions" '*.nuspec' | grep -q "<id>OpenCodeDotNet.Sdk.Extensions</id>"
          unzip -p "$extensions" '*.nuspec' | grep -q "<dependency id=\"OpenCodeDotNet.Sdk\" version=\"${PACKAGE_VERSION}\""
          echo "Packing OpenCodeDotNet.Sdk and OpenCodeDotNet.Sdk.Extensions ${PACKAGE_VERSION}."

      # Source Link stamps the built commit into each nuspec's repository element.
      - name: Verify packed commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$(ls packages/*.nupkg | wc -l)" -eq 2
          for package in packages/*.nupkg; do
            nuspec="$(unzip -p "$package" '*.nuspec')"
            if ! grep -q "commit=\"${COMMIT}\"" <<< "$nuspec"; then
              echo "::error::$package does not carry commit $COMMIT."
              exit 1
            fi
          done

      # Trusted Publishing exchanges a GitHub OIDC token for a short-lived nuget.org API key, so
      # there is no long-lived NUGET_API_KEY secret to rotate or leak. The login step sits
      # immediately before the push, not at the top of the job, because the exchanged key is
      # short-lived.
      - name: "NuGet.org login (OIDC)"
        id: nuget-login
        if: inputs.target == 'nuget'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

      # dotnet nuget push implements its own glob expansion; the path is quoted so the shell does
      # not expand it first (two packable projects produce two .nupkg files here).
      #
      # No --skip-duplicate on this lane. The flag reports any 409 as "already exists" and exits
      # zero, which is how two dispatches went green while every push was refused by an ID prefix
      # reservation. Without it a refusal fails here, immediately, carrying the gallery's own
      # message. The cost is that retrying a dispatch after a partial push aborts on the package
      # that already landed — which is the operator's decision to make, not a thing to swallow.
      - name: Push to NuGet.org
        if: inputs.target == 'nuget'
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_KEY"

      # The feed is the repository owner's, so it follows the repository: GitHub Packages links a
      # pushed package to a repository only when the nuspec's repository URL has the same owner.
      - name: Push to GitHub Packages
        if: inputs.target == 'github'
        env:
          PACKAGES_KEY: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: >
          dotnet nuget push "packages/*.nupkg"
          --source "$PACKAGES_FEED"
          --api-key "$PACKAGES_KEY"
          --skip-duplicate
